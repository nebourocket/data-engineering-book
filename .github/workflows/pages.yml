name: pages

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      # postgres・minio・redpanda は services では起動引数を渡せないため、compose.yaml で起動します。
      - run: docker compose up -d --wait
      - run: pytest
        env:
          DE_BOOK_REQUIRE_SERVICES: "1"
          PG_DSN: postgresql://deb:deb@localhost:5432/deb
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          KAFKA_BOOTSTRAP: localhost:19092
      - run: node tests/pro-core.test.mjs
      - run: node worker/test/worker.test.mjs
      - run: mkdocs build --strict

  airflow:
    # 12 章の DAG が読み込めることだけを確かめます（DAG がまだ無ければそのまま通ります）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >
          pip install "apache-airflow==2.10.5"
          --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt"
      # 12 章の DAG が import する duckdb（requirements.txt と同じ版）。
      - run: pip install "duckdb==2.0.0"
      - run: |
          python - <<'PY'
          from airflow.models import DagBag

          bag = DagBag(dag_folder="examples/b12", include_examples=False)
          assert not bag.import_errors, bag.import_errors
          print(f"DAG {len(bag.dags)} 個を読み込みました")
          PY
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"

  deploy:
    # main への push のときだけ公開します。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, airflow]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # mkdocs build の中で hooks/figures.py が図を作ります。
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
