models:
  - name: fct_order_lines
    semantic_model:
      enabled: true
    agg_time_dimension: ordered_at
    columns:
      - name: order_line_id
        entity:
          name: order_line
          type: primary
      - name: customer_id
        entity:
          name: customer
          type: foreign
      - name: ordered_at
        dimension:
          type: time
          granularity: day
      - name: status
        dimension:
          type: categorical
    metrics:
      - name: gross_sales
        label: 売上 (キャンセルを含む)
        type: simple
        agg: sum
        expr: quantity * unit_price
