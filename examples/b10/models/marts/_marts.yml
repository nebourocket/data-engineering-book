version: 2

models:
  - name: dim_customers
    description: 顧客 1 人 1 行。都道府県から地方を付けてある。
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: fct_orders
    description: 注文 1 件 1 行。金額は明細の合計。
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_amount
        data_tests: [is_positive]
  - name: fct_daily_sales
    description: キャンセルを除いた日別の売上。直近 7 日分を毎回作り直す incremental モデル (キャンセルは注文から 7 日以内と仮定)。
    columns:
      - name: order_date
        data_tests: [unique, not_null]
