# Cloudflare Workers の設定 (無料プランで動きます)
# 秘密の値 (STRIPE_SECRET_KEY・LICENSE_PRIVATE_JWK) はここに書かず、
# `npx wrangler secret put <名前>` で登録してください。
name = "de-book-license"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://nebourocket.github.io"
PRICE_JPY = "500"
# Payment Link の ID (plink_...)。このリンク経由の支払いだけを認めます。空のあいだはキーを発行しません。
PAYMENT_LINK_ID = "plink_1UatKQ3KEEQatRT0LorTuPRB"
# 公開鍵 (JSON 文字列)。scripts/gen-keys.mjs の出力を、下のシングルクォート ' の中に貼ります
# (JSON の " をそのまま使えるように TOML のリテラル文字列にしています)。空のあいだは章を配信しません。
LICENSE_PUBLIC_JWK = '{"kty":"EC","x":"Y_B4TtvXYJ9oJgF4c_uBo3-Z3H2xIP-P7lhSY_RCCWM","y":"CpTpNHm8HEPEy1kHTYNyqM_tNTXZF0b5VIaz2C2Zo94","crv":"P-256"}'

# 応用編の本文を入れる KV (2026-11-11 作成)。
[[kv_namespaces]]
binding = "CONTENT"
id = "c496ad0a991a44b3a6aa22053bf2d6b0"
